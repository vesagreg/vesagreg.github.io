<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prace serwisowe</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffb703;
        }
        p {
            font-size: 1.2rem;
            color: #a0a0a0;
            line-height: 1.6;
        }
        .loader {
            border: 4px solid #222;
            border-top: 4px solid #ffb703;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Prace serwisowe</h1>
        <p>Przepraszamy za utrudnienia. Aktualnie wprowadzamy ulepszenia, aby nasza strona działała jeszcze lepiej. Zapraszamy ponownie niebawem!</p>
    </div>
</body>
</html>
